spring.application.name=resume-api

# SQLite database file — stored in the project root
spring.datasource.url=jdbc:sqlite:resume.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate dialect for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# auto: create tables if they don't exist, update schema on restart
spring.jpa.hibernate.ddl-auto=update

# Optional: shows SQL in the console during development
spring.jpa.show-sql=true

# ─── Spring Boot Admin ────────────────────────────────────────
# Mount the Admin Server UI at /admin (keeps it separate from the portfolio at /)
spring.boot.admin.context-path=/admin

# Register this application with its own embedded Admin Server
spring.boot.admin.client.url=http://localhost:8080/admin

# ─── Actuator ─────────────────────────────────────────────────
# Expose all actuator endpoints over HTTP
management.endpoints.web.exposure.include=*

# Show full health details (disk, db, etc.)
management.endpoint.health.show-details=always

# ─── SpringDoc / Swagger UI ──────────────────────────────────
# Mount Swagger UI under /admin so all admin tools live in one place
springdoc.swagger-ui.path=/admin/api-docs
springdoc.api-docs.path=/admin/v3/api-docs

# Sort operations by HTTP method (GET first, then POST, PATCH, etc.)
springdoc.swagger-ui.operations-sorter=method

# Sort tags alphabetically in the sidebar
springdoc.swagger-ui.tags-sorter=alpha

# Enable deep linking (shareable URLs for each endpoint)
springdoc.swagger-ui.deep-linking=true

# Collapse schemas by default to reduce visual clutter
springdoc.swagger-ui.default-models-expand-depth=-1

# Show the "Try it out" button by default
springdoc.swagger-ui.try-it-out-enabled=true
